name: fetch

# 用 GitHub 的免费算力跑 yt-dlp：手机端触发 → 云端下载 → 产出下载链接
on:
  workflow_dispatch:
    inputs:
      url:
        description: "视频链接"
        required: true
      format:
        description: "格式（best / 仅音频填 audio）"
        required: false
        default: "best"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: 安装 yt-dlp
        run: |
          python -m pip install -U --quiet yt-dlp
          yt-dlp --version

      - name: 安装 ffmpeg（apt 快装，超时自动退回 pip 静态版）
        run: |
          if ! timeout 150 sudo apt-get install -y -qq ffmpeg >/dev/null 2>&1; then
            timeout 150 sudo apt-get update -qq >/dev/null 2>&1 || true
            timeout 150 sudo apt-get install -y -qq ffmpeg >/dev/null 2>&1 || true
          fi
          if ! command -v ffmpeg >/dev/null 2>&1; then
            echo "apt 装不上，改用 pip 的静态 ffmpeg"
            python -m pip install --quiet static-ffmpeg
            python -c "import static_ffmpeg;print(static_ffmpeg.add_paths())"
          fi
          command -v ffmpeg && ffmpeg -version | head -1

      - name: 准备 cookies（可选）
        env:
          COOKIES_B64: ${{ secrets.KEDOU_COOKIES_B64 }}
        run: |
          if [ -n "$COOKIES_B64" ]; then
            echo "$COOKIES_B64" | base64 -d > cookies.txt
            echo "已写入 cookies.txt：$(wc -c < cookies.txt) 字节"
          else
            echo "未配置 KEDOU_COOKIES_B64（YouTube 人机验证时需要它）"
          fi

      - name: 下载
        env:
          URL: ${{ inputs.url }}
          FMT: ${{ inputs.format }}
          PROXY: ${{ secrets.KEDOU_PROXY }}
        run: |
          mkdir -p out
          EXTRA=""
          if [ -f cookies.txt ]; then EXTRA="--cookies cookies.txt"; fi
          if [ -n "$PROXY" ]; then EXTRA="$EXTRA --proxy $PROXY"; fi
          echo "附加参数: $EXTRA"
          CLIENT="youtube:player_client=android,web_safari,tv,mweb"
          if [ "$FMT" = "audio" ]; then
            yt-dlp --no-playlist -f bestaudio -x --audio-format mp3 $EXTRA \
              --extractor-args "$CLIENT" \
              -o "out/%(title).100B [%(id)s].%(ext)s" "$URL" || \
            yt-dlp --no-playlist -f best $EXTRA \
              --extractor-args "$CLIENT" \
              -o "out/%(title).100B [%(id)s].%(ext)s" "$URL"
          else
            yt-dlp --no-playlist -f "$FMT/best" --merge-output-format mp4 $EXTRA \
              --extractor-args "$CLIENT" \
              -o "out/%(title).100B [%(id)s].%(ext)s" "$URL"
          fi
          echo "--- 产出 ---"
          ls -la out/ || true
          du -h out/* 2>/dev/null || true

      - name: 上传为构建产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: media-${{ github.run_id }}
          path: out/
          if-no-files-found: warn

      - name: 发布到 Release（生成可匿名下载的链接）
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: job-${{ github.run_id }}
          name: "任务 ${{ github.run_id }}"
          body: |
            来源：${{ inputs.url }}
            格式：${{ inputs.format }}
          files: out/*
          fail_on_unmatched_files: false
          make_latest: false
